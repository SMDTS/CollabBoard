# frontend/nginx.conf
#
# "server" here is the docker-compose service name for the backend — DNS
# inside the compose network, not a real hostname. In production behind a
# different reverse proxy, point these two proxy_pass targets at wherever
# the API container actually lives.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # REST API. proxy_http_version 1.1 (not the default 1.0) is needed for
    # keep-alive to the upstream; doesn't affect WebSockets here, that's
    # the block below.
    location /api/ {
        proxy_pass http://server:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Socket.IO. This is the block that's easy to forget: without the
    # Upgrade/Connection headers, nginx proxies the request as plain HTTP,
    # the WebSocket handshake silently fails, and Socket.IO falls back to
    # (or just fails at) long-polling instead — sockets *look* like they
    # might work and then never actually deliver a real-time event.
    location /socket.io/ {
        proxy_pass http://server:4000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # A socket connection is long-lived on purpose — nginx's default
        # read timeout (60s) would silently kill an idle-but-open
        # connection well before the user notices anything's wrong.
        proxy_read_timeout 86400;
    }

    # SPA fallback: any path that isn't a real static file goes to
    # index.html so React Router can handle it client-side (e.g. a
    # hard refresh on /boards/abc123 shouldn't 404 from nginx).
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Long cache for hashed build assets; index.html itself is deliberately
    # not cached (see the location / block above) so a new deploy is
    # picked up on the next load instead of needing a hard refresh.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
