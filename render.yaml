# render.yaml — Render Blueprint
#
# https://render.com/docs/blueprint-spec
#
# Two services, both free tier, no code changes needed to deploy from
# here — backend/Dockerfile and the frontend build already read every env
# var referenced below via backend/src/config.js and frontend/src/api/client.js.
#
# Live at:
#   https://collabboard-client-p85o.onrender.com  (collabboard-client)
#   https://collabboard-api-cn2v.onrender.com      (collabboard-api)
#
# Both names below got a suffix appended by Render — "collabboard-api" and
# "collabboard-client" were already taken by someone else (.onrender.com
# names are global), so CLIENT_ORIGIN and VITE_API_URL are set to the real
# assigned URLs above, not the plain names. If you fork this repo and
# deploy your own copy, the same thing will likely happen to you with a
# *different* random suffix — check each service's actual URL in the
# Render Dashboard after the first deploy and update these two values
# (then redeploy the client — VITE_API_URL is baked in at build time, so
# just saving the env var isn't enough) to match.

services:
  # ---- backend: Docker web service ----
  - type: web
    name: collabboard-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /api/health
    envVars:
      # Render sets PORT itself (defaults to 10000) and injects it into the
      # container automatically — do NOT set PORT here. The backend already
      # reads process.env.PORT (config.js), and the Dockerfile's own
      # HEALTHCHECK follows the same $PORT rather than a hardcoded value.
      - key: CLIENT_ORIGIN
        value: https://collabboard-client-p85o.onrender.com
      # Prompted for at Blueprint creation time in the Render Dashboard —
      # never committed here. Generate a long random string for JWT_SECRET;
      # get MONGODB_URI from your Atlas cluster's "Connect your application"
      # dialog (see docs/DEPLOYMENT.md).
      - key: JWT_SECRET
        sync: false
      - key: MONGODB_URI
        sync: false

  # ---- frontend: static site ----
  - type: web
    runtime: static
    name: collabboard-client
    buildCommand: cd frontend && npm ci && npm run build
    staticPublishPath: frontend/dist
    routes:
      # SPA fallback — without this, a hard refresh on e.g. /boards/abc123
      # 404s instead of letting React Router handle it client-side.
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      # Baked into the JS bundle at build time (Vite), not read at runtime —
      # this is why it's a real URL here, unlike the "" used for the
      # same-origin Docker Compose setup in docker-compose.yml. The two
      # deployments intentionally use different values for the same var;
      # see docs/DEPLOYMENT.md for why.
      - key: VITE_API_URL
        value: https://collabboard-api-cn2v.onrender.com
